        <style type="text/css">
            text {
                font-family: Calibri;
            }
            
            #nodes circle {
                stroke: #c0412d;
                stroke-width: 2px;
                fill: white;
            }
            
            #nodes g.non-canonical circle {
                stroke: Gray;
            }
            
            text.persLabel,
            text.persLabelLarge,
            text.persLabelSmall {
                text-anchor: middle;
                line-height: 100px;
                dominant-baseline: middle;
            }
            
            text.persLabel tspan:only-child {
                dominant-baseline: middle;
            }
            
            text.persLabel {
                font-size: 12px;
            }
            
            text.persLabelLarge {
                font-size: 22px;
            }
            
            text.persLabelSmall {
                font-size: 10px;
            }
            
            g#nodes g:hover circle {
                transition-duration: 0.5s;
                transition-property: stroke-width, fill;
                stroke-width: 6px;
                cursor: pointer;
            }
            
            text {
                pointer-events: none;
            }
            
            #nodes g.non-canonical text {
                fill: Gray;
            }
            
            line {
                stroke-linecap: round;
            }
            
            line:hover {
                stroke: DarkRed !important;
            }
            
            line.connected {
                stroke: LightGreen;
            }
            
            line.connected_label {
                stroke: DarkGreen;
            }
            
            line.line {
                stroke: CornflowerBlue;
            }
            
            line.line_label {
                stroke: DarkSlateBlue;
            }
            
            line.label {
                stroke: Gray;
                stroke-dasharray: 8 10;
            }</style>
