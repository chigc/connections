        <style type="text/css">
            text {
                font-family: Calibri;
            }
            
            #nodes circle {
                stroke: #c0412d;
                stroke-width: 2px;
                fill: white;
            }
            
            #nodes g.non-canonical circle {
                stroke: Gray;
            }
            
            text.persLabel,
            text.persLabelLarge,
            text.persLabelSmall {
                text-anchor: middle;
                line-height: 100px;
                dominant-baseline: middle;
            }
            
            text.persLabel tspan:only-child {
                dominant-baseline: middle;
            }
            
            text.persLabel {
                font-size: 12px;
            }
            
            text.persLabelLarge {
                font-size: 22px;
            }
            
            text.persLabelSmall {
                font-size: 10px;
            }
            
            g#nodes g:hover circle {
                transition-duration: 0.5s;
                transition-property: stroke-width, fill;
                stroke-width: 6px;
                cursor: pointer;
            }
            
            text {
                pointer-events: none;
            }
            
            #nodes g.non-canonical text {
                fill: Gray;
            }
            
            line {
                stroke-linecap: round;
            }
            
            line:hover {
                opacity: 0.5;
            }
            
            .C2 {
                stroke: OrangeRed;
                color: OrangeRed;
            }
            
            .H {
                stroke: LimeGreen;
                color: LimeGreen;
            }
            
            .K {
                stroke: CornflowerBlue;
                color: CornflowerBlue;
            }
            
            .Lz1 {
                stroke: GoldenRod;
                color: GoldenRod;
            }
            
            .F1 {
                stroke: Indigo;
                color: Indigo;
            }
            .Cl {
                stroke: Plum;
                color: Plum;
            }
            .form-check-label {
                font-weight: bold;
            }</style>
